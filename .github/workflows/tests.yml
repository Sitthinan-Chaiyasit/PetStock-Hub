name: Application tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petstock_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: petstock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://petstock_test:local-ci-only@localhost:5432/petstock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
