{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow">คลังกลาง</p><h1>รับสินค้าเข้าคลัง</h1><p class="muted">เพิ่มล็อตและวันหมดอายุเพื่อการจ่าย FEFO ที่ถูกต้อง</p></div></header><article class="card form-card"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="wide">สินค้า<select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.sku}} — {{p.name}}</option>{% endfor %}</select></label><label>สถานที่<select name="location_id">{% for l in locations %}<option value="{{l.id}}">{{l.name}}</option>{% endfor %}</select></label><label>จำนวน<input name="quantity" type="number" min="1" required></label><label>เลขล็อต<input name="lot_no" placeholder="เช่น DOG2501A"></label><label>วันหมดอายุ<input name="expires_on" type="date"></label><label class="wide">หมายเหตุ<textarea name="note" placeholder="เลขที่รับเข้า / ผู้จำหน่าย"></textarea></label><div class="wide"><button>บันทึกรับสินค้า</button></div></form></article>{% endblock %}
